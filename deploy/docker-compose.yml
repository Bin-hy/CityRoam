services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trippilot
      POSTGRES_PASSWORD: trippilot
      POSTGRES_DB: trippilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippilot -d trippilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trippilot:trippilot@postgres:5432/trippilot?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: info
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-统一登录}"
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      AUTH_WEB_BASE_URL: ${AUTH_WEB_BASE_URL:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_SUBS: ${ADMIN_SUBS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      HOTEL_PLUGIN_ENABLED: ${HOTEL_PLUGIN_ENABLED:-false}
      HOTEL_TOOL_URL: ${HOTEL_TOOL_URL:-http://hotel-tool:8090}
      HOTEL_TOOL_TOKEN: ${HOTEL_TOOL_TOKEN:-}
      HOTEL_SEARCH_TIMEOUT: ${HOTEL_SEARCH_TIMEOUT:-10s}
      HOTEL_CACHE_TTL: ${HOTEL_CACHE_TTL:-30m}
      GUIDE_PLUGIN_ENABLED: ${GUIDE_PLUGIN_ENABLED:-false}
      GUIDE_SEARCH_BASE_URL: ${GUIDE_SEARCH_BASE_URL:-https://api.deepseek.com}
      GUIDE_SEARCH_API_KEY: ${GUIDE_SEARCH_API_KEY:-}
      GUIDE_SEARCH_TIMEOUT: ${GUIDE_SEARCH_TIMEOUT:-10s}
      GUIDE_CACHE_TTL: ${GUIDE_CACHE_TTL:-6h}
      RESEARCH_TIMEOUT: ${RESEARCH_TIMEOUT:-12s}
      RESEARCH_MAX_TOOL_CALLS: ${RESEARCH_MAX_TOOL_CALLS:-6}
      WEATHER_CACHE_TTL: ${WEATHER_CACHE_TTL:-30m}
      WEATHER_TOOL_TIMEOUT: ${WEATHER_TOOL_TIMEOUT:-3s}
      WEATHER_MAX_CALLS_PER_RUN: ${WEATHER_MAX_CALLS_PER_RUN:-1}
    depends_on:
      postgres:
        condition: service_healthy

  hotel-tool:
    profiles: ["plugins"]
    build:
      context: ./hotel-tool
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8090"
      HOTEL_TOOL_TOKEN: ${HOTEL_TOOL_TOKEN:-}
      FLYAI_BIN: /app/node_modules/.bin/flyai
      FLYAI_API_KEY: ${FLYAI_API_KEY:-}
      FLYAI_TIMEOUT_MS: ${FLYAI_TIMEOUT_MS:-9000}
      FLYAI_HEALTH_TIMEOUT_MS: ${FLYAI_HEALTH_TIMEOUT_MS:-1500}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    # No host port: only the API reaches the sidecar on the compose network.

  caddy:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
