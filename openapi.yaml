openapi: 3.1.0
info:
  title: TripPilot API
  version: 0.1.0
  description: Multi-constraint Beijing trip planning API with an asynchronous agent pipeline.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: "{protocol}://{host}"
    description: TripPilot API
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: localhost:8080
security: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"

  /api/meta:
    get:
      operationId: getMeta
      summary: Cities, defaults and rate limit
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: Current authentication state
      security: []
      responses:
        "200":
          description: Authentication toggle and current user, never cached
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"

  /api/auth/login:
    get:
      operationId: startLogin
      summary: Start the OIDC authorization code flow
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: Same-site path to return to after login
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the identity provider
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/auth/callback:
    get:
      operationId: oidcCallback
      summary: OIDC callback that creates the session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the web app or login page with an error code
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: Delete the server-side session
      security: []
      responses:
        "200":
          description: Identity provider logout URL when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogout"
        "204":
          description: Session cleared without an identity provider logout URL

  /api/trips:
    get:
      operationId: listTrips
      summary: List trips owned by the current user
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Trip summaries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTrip
      summary: Create a trip and start planning
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "202":
          description: Planning run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTrip"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}:
    parameters:
      - $ref: "#/components/parameters/TripID"
    get:
      operationId: getTrip
      summary: Get the trip summary and latest artifacts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Trip summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTrip
      summary: Soft-delete a trip
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Trip deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/versions:
    parameters:
      - $ref: "#/components/parameters/TripID"
    get:
      operationId: listPlanVersions
      summary: List plan versions, newest first
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Plan versions
          content:
            application/json:
              schema:
                type: object
                required:
                  - versions
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlanVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/versions/{seq}:
    parameters:
      - $ref: "#/components/parameters/TripID"
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getPlanVersion
      summary: Get one plan version by sequence
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Plan version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanVersion"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/versions/{seq}/restore:
    parameters:
      - $ref: "#/components/parameters/TripID"
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: restorePlanVersion
      summary: Roll back to a previous version by copying it to a new accepted version
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Restored plan version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanVersion"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/diff:
    parameters:
      - $ref: "#/components/parameters/TripID"
      - name: from
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: to
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
    get:
      operationId: diffPlanVersions
      summary: Compare two plan versions, defaulting to the latest two
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Version diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiff"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/adjustments:
    parameters:
      - $ref: "#/components/parameters/TripID"
    post:
      operationId: createAdjustment
      summary: Start a scoped adjustment run from a base version
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "202":
          description: Adjustment run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/replan:
    parameters:
      - $ref: "#/components/parameters/TripID"
    post:
      operationId: replanTrip
      summary: Re-run the pipeline with a full constraint patch from a base version
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanRequest"
      responses:
        "202":
          description: Replan run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/trips/{tripID}/share:
    parameters:
      - $ref: "#/components/parameters/TripID"
    post:
      operationId: createShare
      summary: Share the latest accepted version
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/runs/{runID}/resume:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: resumeRun
      summary: Provide constraints, accept, reject or revise an awaiting run
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "202":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAction"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/runs/{runID}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: cancelRun
      summary: Cancel a run; terminal runs are unchanged
      security:
        - sessionCookie: []
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /api/runs/{runID}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: Last-Event-ID
        in: header
        required: false
        description: Last sequence received, used for replay
        schema:
          type: integer
          minimum: 0
      - name: after
        in: query
        required: false
        description: Alternative cursor when the header cannot be set
        schema:
          type: integer
          minimum: 0
    get:
      operationId: streamRunEvents
      summary: Stream run events over SSE
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Server-sent events with heartbeats every two seconds
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/share/{slug}:
    get:
      operationId: getSharedTrip
      summary: Get a read-only shared trip
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTrip"
        "404":
          $ref: "#/components/responses/Error"

  /api/eval/cases:
    get:
      operationId: listEvalCases
      summary: List evaluation cases
      security:
        - sessionCookie: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "200":
          description: Evaluation cases
          content:
            application/json:
              schema:
                type: object
                required:
                  - cases
                properties:
                  cases:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvalCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"

  /api/eval/runs:
    get:
      operationId: listEvalRuns
      summary: List evaluation results
      security:
        - sessionCookie: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "200":
          description: Evaluation results
          content:
            application/json:
              schema:
                type: object
                required:
                  - runs
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvalRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: startEval
      summary: Start a full evaluation batch
      security:
        - sessionCookie: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "202":
          description: Batch started
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: started
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"

components:
  parameters:
    TripID:
      name: tripID
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: runID
      in: path
      required: true
      schema:
        type: string
    AdminToken:
      name: X-Admin-Token
      in: header
      required: false
      description: Alternative to an admin session; the Authorization bearer header is also accepted
      schema:
        type: string

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: trippilot_session
      description: Server-side session cookie issued by the OIDC callback; required when AUTH_ENABLED=true
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Static admin token for scripts and emergency access

  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    Meta:
      type: object
      required:
        - version
        - cities
        - defaults
        - rate_limit
      properties:
        version:
          type: string
        cities:
          type: array
          items:
            type: string
        defaults:
          type: object
          required:
            - days
            - pace
            - currency
            - max_trip_days
          properties:
            days:
              type: integer
            pace:
              type: string
            currency:
              type: string
            max_trip_days:
              type: integer
        rate_limit:
          type: object
          required:
            - per_hour
          properties:
            per_hour:
              type: integer
        plugins:
          type: object
          required:
            - hotels
            - guides
          properties:
            hotels:
              $ref: "#/components/schemas/PluginStatus"
            guides:
              $ref: "#/components/schemas/PluginStatus"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillPin"

    SkillPin:
      type: object
      required:
        - name
        - version
        - sha256
      properties:
        name:
          type: string
        version:
          type: string
        sha256:
          type: string

    PluginStatus:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        disabled_reason:
          type: string

    AuthUser:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
        email:
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - user
            - admin

    AuthMe:
      type: object
      required:
        - enabled
        - authenticated
        - provider_name
      properties:
        enabled:
          type: boolean
          description: Whether login is mandatory
        authenticated:
          type: boolean
        provider_name:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthLogout:
      type: object
      required:
        - redirect_url
      properties:
        redirect_url:
          type: string
          description: Identity provider end-session URL to send the browser to

    TripSummary:
      type: object
      required:
        - id
        - city
        - days
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        city:
          type: string
        days:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        latest_run:
          $ref: "#/components/schemas/TripListRun"
        latest_version:
          $ref: "#/components/schemas/TripListVersion"

    TripListRun:
      type: object
      required:
        - id
        - status
        - stage
      properties:
        id:
          type: string
        status:
          type: string
        stage:
          type: string

    TripListVersion:
      type: object
      required:
        - seq
        - status
        - created_at
      properties:
        seq:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time

    TripList:
      type: object
      required:
        - trips
      properties:
        trips:
          type: array
          items:
            $ref: "#/components/schemas/TripSummary"

    CreateTripRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 2000
        city:
          type: string
          enum:
            - beijing
        client_request_id:
          type: string

    CreatedTrip:
      type: object
      required:
        - trip_id
        - run_id
        - events_url
      properties:
        trip_id:
          type: string
        run_id:
          type: string
        events_url:
          type: string

    Trip:
      type: object
      required:
        - id
        - city
        - days
        - status
        - constraints
        - created_at
        - updated_at
      properties:
        id:
          type: string
        city:
          type: string
        days:
          type: integer
        budget_yuan:
          type:
            - integer
            - "null"
        status:
          type: string
        constraints:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        latest_run:
          $ref: "#/components/schemas/RunSummary"
        latest_version:
          $ref: "#/components/schemas/PlanVersion"

    RunSummary:
      type: object
      required:
        - id
        - mode
        - status
        - stage
        - round
        - created_at
      properties:
        id:
          type: string
        mode:
          type: string
          enum:
            - initial
            - adjustment
            - replan
            - eval
        status:
          type: string
          enum:
            - queued
            - running
            - awaiting_user
            - completed
            - failed
            - cancelled
        stage:
          type: string
        round:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        error_code:
          type: string

    PlanVersion:
      type: object
      required:
        - id
        - trip_id
        - run_id
        - seq
        - plan
        - constraints
        - status
        - created_at
      properties:
        id:
          type: string
        trip_id:
          type: string
        run_id:
          type: string
        seq:
          type: integer
        plan:
          type: object
          additionalProperties: true
        constraints:
          type: object
          additionalProperties: true
        violations:
          type: array
          items:
            type: object
            additionalProperties: true
        diff_summary:
          type: object
          additionalProperties: true
        reason:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - draft
            - accepted
            - superseded
        created_at:
          type: string
          format: date-time
        research:
          $ref: "#/components/schemas/ResearchBrief"

    ResearchBrief:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - skipped
        accommodation:
          $ref: "#/components/schemas/AccommodationBrief"
        guides:
          type: array
          items:
            $ref: "#/components/schemas/GuideSignal"
        notes:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        tool_calls:
          type: integer
        duration_ms:
          type: integer

    AccommodationBrief:
      type: object
      properties:
        mentioned:
          type: boolean
        specified:
          type: array
          items:
            type: string
        selected:
          $ref: "#/components/schemas/Hotel"
        options:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        anchor_days:
          type: array
          items:
            type: integer
        nights:
          type: integer
        nightly_yuan:
          type: integer
        total_yuan:
          type: integer
        price_estimated:
          type: boolean
        include_in_budget:
          type: boolean
        reason:
          type: string

    Hotel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        star:
          type: integer
        score:
          type:
            - number
            - "null"
        price_per_night_yuan:
          type: integer
        price_estimated:
          type: boolean
        booking_url:
          type: string
        provider:
          type: string
        fetched_at:
          type: string
          format: date-time

    TransitLeg:
      type: object
      description: 一段交通几何，polyline 为 [lng, lat] 坐标序列
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - walk
            - transit
            - drive
        line_name:
          type: string
        from_stop:
          type: string
        to_stop:
          type: string
        distance_m:
          type: integer
        duration_min:
          type: integer
        cost_yuan:
          type: integer
        polyline:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        estimated:
          type: boolean

    Transport:
      type: object
      description: 两个相邻行程块之间的交通；legs 缺失时前端按直线虚线回退
      properties:
        mode:
          type: string
        from_poi_id:
          type: string
        to_poi_id:
          type: string
        distance_m:
          type: integer
        duration_min:
          type: integer
        cost_yuan:
          type: integer
        estimated:
          type: boolean
        legs:
          type: array
          items:
            $ref: "#/components/schemas/TransitLeg"

    Lodging:
      type: object
      description: 行程住宿摘要（行程 JSON 的 lodging 字段）
      required:
        - hotel
        - include_in_budget
      properties:
        hotel:
          $ref: "#/components/schemas/Hotel"
        nights:
          type: integer
        nightly_yuan:
          type: integer
        total_yuan:
          type: integer
        anchor_days:
          type: array
          items:
            type: integer
        include_in_budget:
          type: boolean
        price_estimated:
          type: boolean
        source:
          type: string

    GuideSignal:
      type: object
      properties:
        poi_id:
          type: string
        weight:
          type: number
        mentions:
          type: integer
        note:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/GuideCitation"

    GuideCitation:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        site:
          type: string
        published_at:
          type:
            - string
            - "null"
          format: date-time
        authority:
          type: integer

    ResearchQuestion:
      type: object
      required:
        - code
        - message
        - options
      properties:
        code:
          type: string
        message:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/ResearchOption"

    ResearchOption:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        hotel:
          $ref: "#/components/schemas/Hotel"

    VersionDiff:
      type: object
      required:
        - from
        - to
        - diff
      properties:
        from:
          type: integer
        to:
          type: integer
        diff:
          type: object
          additionalProperties: true

    AdjustmentRequest:
      type: object
      required:
        - input
        - base_version
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 2000
        base_version:
          type: integer
          minimum: 1
        client_request_id:
          type: string

    ReplanRequest:
      type: object
      required:
        - base_version
        - constraints
      properties:
        base_version:
          type: integer
          minimum: 1
        constraints:
          type: object
          additionalProperties: true
        client_request_id:
          type: string

    RunAccepted:
      type: object
      required:
        - run_id
        - events_url
      properties:
        run_id:
          type: string
        events_url:
          type: string

    ResumeRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          description: |
            - `provide_constraints`: 补充缺失信息后重新规划
            - `accept`: 接受当前方案
            - `reject`: 首次方案拒绝时取消；调整提案拒绝时恢复基线方案并保持 awaiting_user，阶段为 proposal_rejected
            - `revise`: 携带修改建议在同一运行上转为调整模式
            - `resolve_research`: 回答待确认的研究问题
          enum:
            - provide_constraints
            - accept
            - reject
            - revise
            - resolve_research
        input:
          type: string
        constraints:
          type: object
          additionalProperties: true
        research_choice:
          $ref: "#/components/schemas/ResearchChoice"

    ResearchChoice:
      type: object
      required:
        - option_id
      properties:
        option_id:
          type: string
        hotel:
          $ref: "#/components/schemas/Hotel"

    RunAction:
      type: object
      required:
        - run_id
        - status
      properties:
        run_id:
          type: string
        status:
          type: string

    Share:
      type: object
      required:
        - slug
        - url
        - trip_id
        - version_seq
        - created_at
      properties:
        slug:
          type: string
        url:
          type: string
        trip_id:
          type: string
        version_seq:
          type: integer
        created_at:
          type: string
          format: date-time

    SharedTrip:
      type: object
      required:
        - slug
        - trip_id
        - created_at
        - version
      properties:
        slug:
          type: string
        trip_id:
          type: string
        created_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/PlanVersion"

    EvalCase:
      type: object
      required:
        - id
        - input
        - expected
        - tags
        - enabled
      properties:
        id:
          type: string
        input:
          type: string
        expected:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    EvalRun:
      type: object
      required:
        - id
        - case_id
        - metrics
        - passed
        - created_at
      properties:
        id:
          type: string
        case_id:
          type: string
        run_id:
          type:
            - string
            - "null"
        metrics:
          type: object
          additionalProperties: true
        passed:
          type: boolean
        duration_ms:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is enabled and no valid session was provided
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but missing the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
